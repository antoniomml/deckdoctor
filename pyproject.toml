[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deckdoctor"
version = "0.3.0"
description = "Diagnostics and opt-in fixes for SteamOS, Decky Loader, plugins, and Flatpak"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "DeckDoctor contributors" }]
keywords = ["steamdeck", "steamos", "decky", "flatpak", "diagnostic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Diagnostics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
deckdoctor = "deckdoctor.cli:main"

[project.urls]
Homepage = "https://github.com/antoniomml/deckdoctor"
Documentation = "https://github.com/antoniomml/deckdoctor/blob/main/docs/design.md"
Issues = "https://github.com/antoniomml/deckdoctor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["deckdoctor"]
strict = true
warn_return_any = false
